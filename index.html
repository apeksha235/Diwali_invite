<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diwali at Room 81</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Mukta:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --night:#140a2e; --plum:#2c0f3f; --marigold:#ffb627; --vermilion:#e8461e;
  --spark:#fff2b0; --cream:#fbeedd; --muted:#c9b6d8;
  color-scheme: dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --night:#140a2e; --cream:#fbeedd; } }
:root[data-theme="dark"]{ --night:#140a2e; --cream:#fbeedd; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;overflow:hidden;
  background:radial-gradient(120% 80% at 50% 110%, #4a1530 0%, var(--plum) 35%, var(--night) 75%);
  background-color:var(--night);
  color:var(--cream);font-family:"Mukta",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;
}
#stage{position:fixed;inset:0;overflow:hidden}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
#stars{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
header{
  position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 6vh);
  text-align:center;padding:0 20px;z-index:3;
}
h1{
  font-family:"Yatra One","Mukta",serif;font-weight:400;margin:0;
  font-size:clamp(2.6rem,9vw,5.5rem);line-height:1;letter-spacing:.01em;
  color:var(--marigold);
  text-shadow:0 0 18px rgba(255,182,39,.45),0 0 2px #fff6;
}
.sub{margin:.6rem auto 0;max-width:30ch;font-size:clamp(1rem,2.6vw,1.2rem);color:var(--muted);line-height:1.45}
#hint{transition:opacity .4s}
.ground{
  position:absolute;left:0;right:0;bottom:0;height:22vh;z-index:1;
  background:linear-gradient(to top,#1a0710,rgba(26,7,16,0));
}
.ground svg{position:absolute;left:50%;bottom:-6vh;transform:translateX(-50%);width:min(560px,120vw);opacity:.22}
#pataka{
  position:absolute;z-index:4;width:clamp(78px,14vw,110px);
  left:calc(68% - 40px);bottom:12vh;
  transform-origin:50% 100%;transition:transform .25s;
}
#pataka.ready{animation:wobble 2.4s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:rotate(0)}50%{transform:rotate(-2deg)}}
#pataka.gone{transform:scale(0) !important;transition:transform .08s;animation:none}
#fuljhadi{
  position:absolute;z-index:6;width:30px;height:260px;left:22%;top:calc(100% - 12vh - 260px);
  cursor:grab;touch-action:none;padding:0;border:0;background:none;
  transform:rotate(-14deg);transform-origin:50% 100%;
}
#fuljhadi:active{cursor:grabbing}
#fuljhadi:focus-visible{outline:2px dashed var(--marigold);outline-offset:8px;border-radius:6px}
#fuljhadi svg{width:100%;height:100%;display:block;pointer-events:none}
.tag{
  position:absolute;z-index:3;font-size:.95rem;color:var(--muted);
  white-space:nowrap;transform:translateX(-50%);pointer-events:none;transition:opacity .4s;
}
#flash{position:fixed;inset:0;background:#fff7d6;opacity:0;pointer-events:none;z-index:8}
.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{
  10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(5px,-3px)}
  30%,50%,70%{transform:translate(-9px,4px)}40%,60%{transform:translate(9px,-4px)}
}
#invite{
  position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);
  background:rgba(12,4,24,.72);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
}
#invite.open{display:flex}
.card{
  position:relative;max-width:min(560px,100%);max-height:100%;
  display:flex;flex-direction:column;align-items:center;gap:14px;
  animation:pop .75s cubic-bezier(.2,1.4,.4,1) both;
}
@keyframes pop{
  0%{transform:translate(var(--ox,0),var(--oy,0)) scale(.05) rotate(-18deg);opacity:0}
  60%{opacity:1}
  100%{transform:none;opacity:1}
}
.card img{
  display:block;max-width:100%;max-height:calc(100vh - 130px);height:auto;border-radius:6px;
  box-shadow:0 0 0 3px var(--marigold),0 0 60px rgba(255,182,39,.55),0 20px 50px rgba(0,0,0,.6);
}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button.btn{
  font:600 1rem "Mukta",system-ui,sans-serif;border-radius:999px;padding:.55em 1.3em;cursor:pointer;
  border:1.5px solid var(--marigold);background:transparent;color:var(--cream);
}
button.btn.primary{background:var(--marigold);color:#2a0d00}
button.btn:focus-visible{outline:2px solid var(--spark);outline-offset:3px}
#after{
  position:absolute;z-index:7;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 4vh);transform:translateX(-50%);
  display:none;gap:10px;
}
#after.show{display:flex}
@media (prefers-reduced-motion: reduce){
  .card{animation-duration:.01s}
  #pataka.ready{animation:none}
}
</style>
</head>
<body>
<div id="stage">
  <canvas id="stars"></canvas>
  <header>
    <h1>शुभ दीपावली</h1>
    <p class="sub" id="hint">Pick up the fuljhadi and touch it to the wick of the pataka.</p>
  </header>

  <div class="ground" aria-hidden="true">
    <svg viewBox="0 0 400 200"><g fill="none" stroke="#ffb627" stroke-width="2">
      <circle cx="200" cy="200" r="190"/><circle cx="200" cy="200" r="150"/><circle cx="200" cy="200" r="110"/>
      <g id="petals"></g></g></svg>
  </div>

  <svg id="pataka" viewBox="0 0 120 210" aria-label="Pataka" role="img">
    <defs>
      <linearGradient id="red" x1="0" x2="1">
        <stop offset="0" stop-color="#8c1406"/><stop offset=".35" stop-color="#e8461e"/>
        <stop offset=".6" stop-color="#ff7a3d"/><stop offset="1" stop-color="#7a1205"/>
      </linearGradient>
      <linearGradient id="gold" x1="0" x2="1">
        <stop offset="0" stop-color="#9a6a00"/><stop offset=".5" stop-color="#ffd76a"/><stop offset="1" stop-color="#8a5a00"/>
      </linearGradient>
    </defs>
    <path id="wick" d="M60 58 C60 40, 66 30, 80 26 S 96 10, 90 4" fill="none" stroke="#5a4636" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="22" y="56" width="76" height="148" rx="9" fill="url(#red)"/>
    <rect x="22" y="70" width="76" height="9" fill="url(#gold)"/>
    <rect x="22" y="180" width="76" height="9" fill="url(#gold)"/>
    <ellipse cx="60" cy="58" rx="38" ry="7" fill="#b52a0e"/>
    <ellipse cx="60" cy="58" rx="10" ry="3" fill="#3a1a0a"/>
    <circle cx="60" cy="128" r="26" fill="#fff2b0" opacity=".95"/>
    <text x="60" y="137" text-anchor="middle" font-family="Yatra One, serif" font-size="25" fill="#b52a0e">बम</text>
  </svg>
  <div class="tag" id="tagP">pataka</div>

  <button id="fuljhadi" aria-label="Fuljhadi. Drag it to the pataka’s wick, or press Enter to light it.">
    <svg viewBox="0 0 30 260" aria-hidden="true">
      <defs>
        <pattern id="grain" width="6" height="6" patternUnits="userSpaceOnUse">
          <rect width="6" height="6" fill="#5b5b62"/><circle cx="2" cy="2" r="1.1" fill="#7c7c86"/><circle cx="5" cy="4.5" r=".9" fill="#43434a"/>
        </pattern>
        <radialGradient id="glow"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#ffe9a0"/><stop offset="1" stop-color="#ffb627" stop-opacity="0"/></radialGradient>
      </defs>
      <line x1="15" y1="6" x2="15" y2="258" stroke="#9a9aa4" stroke-width="2.4" stroke-linecap="round"/>
      <rect id="coat" x="10.5" y="8" width="9" height="150" rx="4.5" fill="url(#grain)"/>
      <circle cx="15" cy="9" r="9" fill="url(#glow)"/>
    </svg>
  </button>
  <div class="tag" id="tagF">fuljhadi</div>

  <div id="after">
    <button class="btn primary" id="reopen">Open invite</button>
    <button class="btn" id="again">Burst another</button>
  </div>
  <canvas id="fx"></canvas>
</div>
<div id="flash"></div>

<div id="invite" role="dialog" aria-modal="true" aria-label="Diwali invitation">

<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = s => document.querySelector(s);
  const stage = $('#stage'), fx = $('#fx'), ctx = fx.getContext('2d');
  const starsC = $('#stars'), sctx = starsC.getContext('2d');
  const stick = $('#fuljhadi'), pataka = $('#pataka'), wick = $('#wick');
  const tagF = $('#tagF'), tagP = $('#tagP'), hint = $('#hint');
  const invite = $('#invite'), card = $('#card'), after = $('#after');
  let W, H, DPR, stars = [];

  // rangoli petals
  const pg = $('#petals');
  for (let i = 0; i < 24; i++) {
    const a = i / 24 * Math.PI;
    const x = 200 + Math.cos(a + Math.PI) * 170, y = 200 + Math.sin(a + Math.PI) * 170;
    pg.insertAdjacentHTML('beforeend', `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="9"/>`);
  }

  function resize() {
    DPR = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    for (const c of [fx, starsC]) { c.width = W * DPR; c.height = H * DPR; }
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    sctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    stars = Array.from({ length: Math.round(W * H / 6000) }, () => ({
      x: Math.random() * W, y: Math.random() * H * .7, r: Math.random() * 1.2 + .2, p: Math.random() * 6
    }));
    placeTags();
  }
  addEventListener('resize', resize);

  // ---- geometry helpers
  const wickLen = wick.getTotalLength();
  wick.style.strokeDasharray = wickLen + ' ' + wickLen;
  function wickPoint(frac) { // frac 0 = base, 1 = tip
    const p = wick.getPointAtLength(wickLen * frac);
    const m = wick.getScreenCTM();
    const sp = pataka.createSVGPoint(); sp.x = p.x; sp.y = p.y;
    const r = sp.matrixTransform(m);
    return { x: r.x, y: r.y };
  }
  function stickTip() {
    const svg = stick.querySelector('svg');
    const m = svg.getScreenCTM();
    const sp = svg.createSVGPoint(); sp.x = 15; sp.y = 9;
    const r = sp.matrixTransform(m);
    return { x: r.x, y: r.y };
  }
  function placeTags() {
    const pr = pataka.getBoundingClientRect(), fr = stick.getBoundingClientRect();
    tagP.style.left = (pr.left + pr.width / 2) + 'px'; tagP.style.top = (pr.bottom + 8) + 'px';
    tagF.style.left = (fr.left + fr.width / 2) + 'px'; tagF.style.top = (fr.bottom + 8) + 'px';
  }

  // ---- particles
  const parts = [];
  const sparkCols = ['#fff7d6', '#fff2b0', '#ffd76a', '#ffb627'];
  function spark(x, y, speed, life, col, branch) {
    const a = Math.random() * Math.PI * 2, v = speed * (.3 + Math.random());
    parts.push({ x, y, px: x, py: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life, max: life,
      col: col || sparkCols[(Math.random() * sparkCols.length) | 0], g: .05, drag: .96, branch, w: 1.4 });
  }
  function burst(x, y, n, speed, palette, g = .06) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = speed * Math.sqrt(Math.random());
      parts.push({ x, y, px: x, py: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - speed * .15,
        life: 60 + Math.random() * 50, max: 110, col: palette[(Math.random() * palette.length) | 0],
        g, drag: .975, w: 2.2, twinkle: Math.random() < .4 });
    }
  }
  const rockets = [];
  function rocket(tx, ty, palette, delay) {
    setTimeout(() => rockets.push({ x: tx + (Math.random() - .5) * 60, y: H, tx, ty, palette }), delay);
  }

  // ---- state
  let lit = false, burning = false, burnT = 0, exploded = false, pataPos = { x: 0, y: 0 };

  function frame(t) {
    // stars
    sctx.clearRect(0, 0, W, H);
    for (const s of stars) {
      const a = reduce ? .7 : .45 + .45 * Math.sin(t / 900 + s.p);
      sctx.fillStyle = `rgba(255,240,210,${a})`;
      sctx.beginPath(); sctx.arc(s.x, s.y, s.r, 0, 7); sctx.fill();
    }

    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(0,0,0,1)';
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';

    // sparkler always fizzes
    const tip = stickTip();
    const n = reduce ? 2 : 7;
    for (let i = 0; i < n; i++) spark(tip.x, tip.y, 3.2, 14 + Math.random() * 16, null, Math.random() < .25);
    const g = ctx.createRadialGradient(tip.x, tip.y, 0, tip.x, tip.y, 46);
    g.addColorStop(0, 'rgba(255,240,190,.55)'); g.addColorStop(1, 'rgba(255,182,39,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(tip.x, tip.y, 46, 0, 7); ctx.fill();

    // contact check
    if (!lit && !exploded) {
      const w = wickPoint(1);
      const d = Math.hypot(w.x - tip.x, w.y - tip.y);
      if (d < 34) lightWick();
    }

    // burning wick
    if (burning) {
      burnT += reduce ? .02 : .011;
      const f = Math.max(0, 1 - burnT);
      wick.style.strokeDashoffset = wickLen * (1 - f);
      const p = wickPoint(f);
      for (let i = 0; i < (reduce ? 2 : 6); i++) spark(p.x, p.y, 2.4, 10 + Math.random() * 12, Math.random() < .5 ? '#ff9a3d' : '#fff2b0');
      if (burnT >= 1) { burning = false; explode(); }
    }

    // rockets
    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i];
      r.y -= Math.max(4, (r.y - r.ty) * .06);
      r.x += (r.tx - r.x) * .04;
      parts.push({ x: r.x, y: r.y, px: r.x, py: r.y + 6, vx: (Math.random() - .5) * .6, vy: 1, life: 18, max: 18, col: '#ffd76a', g: 0, drag: .9, w: 2 });
      if (r.y - r.ty < 6) { burst(r.x, r.ty, reduce ? 50 : 140, 6.5, r.palette, .045); rockets.splice(i, 1); }
    }

    // particles
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.px = p.x; p.py = p.y;
      p.vx *= p.drag; p.vy = p.vy * p.drag + p.g;
      p.x += p.vx; p.y += p.vy; p.life--;
      if (p.branch && p.life === Math.floor(p.max / 2)) {
        for (let k = 0; k < 3; k++) spark(p.x, p.y, 1.8, 8 + Math.random() * 6);
      }
      const a = Math.max(0, p.life / p.max);
      if (p.life <= 0) { parts.splice(i, 1); continue; }
      if (p.twinkle && Math.random() < .3) continue;
      ctx.globalAlpha = a;
      ctx.strokeStyle = p.col; ctx.lineWidth = p.w; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(p.px - p.vx, p.py - p.vy); ctx.lineTo(p.x, p.y); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }

  function lightWick() {
    lit = true; burning = true; burnT = 0;
    hint.textContent = 'It’s lit. Stand back!';
    tagP.style.opacity = 0; tagF.style.opacity = 0;
  }

  function explode() {
    exploded = true;
    const r = pataka.getBoundingClientRect();
    pataPos = { x: r.left + r.width / 2, y: r.top + r.height * .55 };
    pataka.classList.remove('ready'); pataka.classList.add('gone');
    // flash + shake
    const fl = $('#flash');
    fl.animate([{ opacity: reduce ? .3 : .9 }, { opacity: 0 }], { duration: 450, easing: 'ease-out' });
    if (!reduce) { stage.classList.remove('shake'); void stage.offsetWidth; stage.classList.add('shake'); }
    if (navigator.vibrate) navigator.vibrate([60, 30, 120]);
    burst(pataPos.x, pataPos.y, reduce ? 90 : 320, 13, ['#fff7d6', '#ffd76a', '#ffb627', '#e8461e', '#ff7a3d']);
    // red paper debris
    for (let i = 0; i < 40; i++) {
      const a = -Math.PI / 2 + (Math.random() - .5) * 2.4, v = 5 + Math.random() * 9;
      parts.push({ x: pataPos.x, y: pataPos.y, px: pataPos.x, py: pataPos.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
        life: 70, max: 70, col: '#c7260b', g: .22, drag: .98, w: 4 });
    }
    rocket(W * .25, H * .22, ['#ff7a3d', '#ffd76a', '#fff7d6'], 250);
    rocket(W * .75, H * .18, ['#e8461e', '#ffb627', '#ffe2f0'], 450);
    rocket(W * .5, H * .12, ['#ffd76a', '#fff2b0', '#ff9a3d'], 650);
    hint.textContent = 'Shubh Deepavali!';
    setTimeout(openInvite, 700);
  }

  function openInvite() {
    card.style.setProperty('--ox', (pataPos.x - W / 2) + 'px');
    card.style.setProperty('--oy', (pataPos.y - H / 2) + 'px');
    card.style.animation = 'none'; void card.offsetWidth; card.style.animation = '';
    invite.classList.add('open');
    after.classList.remove('show');
    $('#close').focus();
  }
  function closeInvite() {
    invite.classList.remove('open');
    after.classList.add('show');
    $('#reopen').focus();
  }
  function reset() {
    invite.classList.remove('open'); after.classList.remove('show');
    lit = burning = exploded = false; burnT = 0;
    wick.style.strokeDashoffset = 0;
    pataka.classList.remove('gone');
    pataka.classList.add('ready');
    stick.style.left = ''; stick.style.top = '';
    hint.textContent = 'Pick up the fuljhadi and touch it to the wick of the pataka.';
    tagP.style.opacity = 1; tagF.style.opacity = 1;
    placeTags();
    stick.focus();
  }

  $('#close').onclick = closeInvite;
  $('#reopen').onclick = openInvite;
  $('#again').onclick = reset;
  $('#again2').onclick = reset;
  invite.addEventListener('click', e => { if (e.target === invite) closeInvite(); });
  addEventListener('keydown', e => { if (e.key === 'Escape' && invite.classList.contains('open')) closeInvite(); });

  // ---- dragging
  let drag = null;
  stick.addEventListener('pointerdown', e => {
    stick.setPointerCapture(e.pointerId);
    const r = stick.getBoundingClientRect();
    const sr = stage.getBoundingClientRect();
    drag = { dx: e.clientX - (stick.offsetLeft + sr.left), dy: e.clientY - (stick.offsetTop + sr.top) };
    tagF.style.opacity = 0;
  });
  stick.addEventListener('pointermove', e => {
    if (!drag) return;
    const x = Math.min(Math.max(e.clientX - drag.dx, -10), W - 20);
    const y = Math.min(Math.max(e.clientY - drag.dy, -20), H - 60);
    stick.style.left = x + 'px'; stick.style.top = y + 'px';
  });
  const end = () => { drag = null; };
  stick.addEventListener('pointerup', end);
  stick.addEventListener('pointercancel', end);

  // keyboard / tap fallback: glide the sparkler to the wick
  stick.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && !lit) { e.preventDefault(); glide(); }
  });
  function glide() {
    const tip = stickTip(), w = wickPoint(1);
    const sx = stick.offsetLeft, sy = stick.offsetTop;
    const tx = sx + (w.x - tip.x), ty = sy + (w.y - tip.y);
    const t0 = performance.now(), dur = reduce ? 10 : 900;
    (function step(now) {
      const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      stick.style.left = (sx + (tx - sx) * e) + 'px';
      stick.style.top = (sy + (ty - sy) * e) + 'px';
      if (k < 1) requestAnimationFrame(step);
    })(t0);
  }

  pataka.classList.add('ready');
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
